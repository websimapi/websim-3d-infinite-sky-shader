<html>
<head>
  <title>3D Infinite Sky Shader with Silhouette</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      background: black;
    }
    .container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 100vh;
      max-height: 100vw;
      aspect-ratio: 1/1;
      transition: all 0.3s ease;
    }
    .container.widescreen {
      aspect-ratio: 16/9;
    }
    .container.fullscreen {
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: unset;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .human-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) translateY(50%) scale(2.66);
      height: 100%;
      width: auto;
      z-index: 1;
      pointer-events: none;
      mix-blend-mode: multiply;
      opacity: 0.95;
    }
    .controls {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 2;
    }
    button {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: white;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 4px;
      font-family: Arial, sans-serif;
      transition: background 0.3s ease;
    }
    button:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    button.active {
      background: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>
  <div class="controls">
    <button id="squareBtn" class="active">Square</button>
    <button id="wideBtn">Widescreen</button>
    <button id="fullBtn">Fullscreen</button>
  </div>
  <div class="container">
    <canvas id="canvas"></canvas>
    <img src="human.png" class="human-overlay" alt="Human silhouette overlay">
  </div>
  <script type="module" src="sky.js"></script>

</html>
