<html>
<head>
  <title>3D Infinite Sky Shader with Silhouette</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      background: black;
    }
    .container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 177.78vh; /* 16:9 aspect ratio */
      max-height: 100vh;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .human-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) translateY(50%) scale(2.66);
      height: 100%;
      width: auto;
      z-index: 1;
      pointer-events: none;
      mix-blend-mode: multiply;
      opacity: 0.95;
    }
    .controls {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 2;
    }
    button {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: white;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 4px;
      font-family: Arial, sans-serif;
      transition: background 0.3s;
    }
    button:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <canvas id="canvas"></canvas>
    <img src="human.png" class="human-overlay" alt="Human silhouette overlay">
  </div>
  <div class="controls">
    <button id="fullscreenButton">Fullscreen</button>
  </div>
  <script type="module" src="sky.js"></script>
  <script type="module" src="controls.js"></script>

</body>
</html>
